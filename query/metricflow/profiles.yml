# The benchmark warehouses (docker-compose.yml): Postgres by default, ClickHouse with DBT_TARGET=ch.
# Bench-only credentials.
bench:
  target: "{{ env_var('DBT_TARGET', 'bench') }}"
  outputs:
    bench:
      type: postgres
      host: 127.0.0.1
      port: 55432
      user: bench
      password: bench
      dbname: bench
      schema: mf
      threads: 1
    ch:
      type: clickhouse
      host: 127.0.0.1
      port: 58123
      user: bench
      password: bench
      schema: mf
      threads: 1
