# The warehouses and the tools that run as servers. Started by run.sh; ports
# are on 127.0.0.1 only and chosen to stay clear of anfra's dev ones.
name: anfra-bench-query

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: bench
      POSTGRES_PASSWORD: bench
      POSTGRES_DB: bench
    command: ["postgres", "-c", "shared_buffers=1GB", "-c", "max_connections=200"]
    # Parallel queries share memory through /dev/shm; Docker's default 64 MB runs out on TPC-H's
    # large joins ("could not resize shared memory segment").
    shm_size: 1gb
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "bench"]
      interval: 2s
      retries: 60

  # On the host network, so Superset reaches Postgres the way the host tools
  # do (127.0.0.1:55432), not over the compose network.
  superset:
    build: ./superset
    network_mode: host
    environment:
      SUPERSET_CONFIG_PATH: /app/bench/superset_config.py
      SUPERSET_BIND_ADDRESS: 127.0.0.1
      SUPERSET_PORT: "58088"
      GUNICORN_TIMEOUT: "600"
      GUNICORN_LOGLEVEL: warning
      ACCESS_LOG_FILE: /dev/null
    volumes:
      - ./superset/superset_config.py:/app/bench/superset_config.py:ro
    depends_on:
      postgres:
        condition: service_healthy

  # Metabase, on the host network for the same reason. Its own metadata stays
  # in its embedded H2 database. The row limits are raised to Metabase's
  # maximum (1,048,575), so the 1M-row case is returned whole.
  metabase:
    image: metabase/metabase:v0.65.5.1
    network_mode: host
    environment:
      MB_JETTY_HOST: 127.0.0.1
      MB_JETTY_PORT: "58089"
      MB_UNAGGREGATED_QUERY_ROW_LIMIT: "1048575"
      MB_AGGREGATED_QUERY_ROW_LIMIT: "1048575"
      MB_ENABLE_QUERY_CACHING: "false"
      MB_ANON_TRACKING_ENABLED: "false"
      MB_CHECK_FOR_UPDATES: "false"
      JAVA_OPTS: "-Xmx3g"
    depends_on:
      postgres:
        condition: service_healthy

  # ClickHouse, its bench_wide copied from Postgres on first start (init.sql).
  # Native protocol on 59000 (clickhouse-client, usql, anfra), HTTP on 58123
  # (Superset, Metabase). Times in UTC, as in Postgres.
  clickhouse:
    image: clickhouse/clickhouse-server:26.8.39.19
    environment:
      CLICKHOUSE_DB: bench
      CLICKHOUSE_USER: bench
      CLICKHOUSE_PASSWORD: bench
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
      TZ: UTC
    ports:
      - "127.0.0.1:59000:9000"
      - "127.0.0.1:58123:8123"
    volumes:
      - ./clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    depends_on:
      postgres:
        condition: service_healthy

  # Cube, for the semantic group: its model in cube/model, on the host network like the BI tools,
  # REST API on 127.0.0.1:58100. Production mode, no pre-aggregations, so no Cube Store: its cache
  # and queue in memory. The row limit is raised so the 100k-row case returns whole. Bench-only secret.
  cube:
    image: cubejs/cube:v1.8.28
    network_mode: host
    environment:
      PORT: "58100"
      CUBEJS_DEV_MODE: "false"
      CUBEJS_API_SECRET: bench-only-not-a-secret
      CUBEJS_DB_TYPE: postgres
      CUBEJS_DB_HOST: 127.0.0.1
      CUBEJS_DB_PORT: "55432"
      CUBEJS_DB_NAME: bench
      CUBEJS_DB_USER: bench
      CUBEJS_DB_PASS: bench
      CUBEJS_CACHE_AND_QUEUE_DRIVER: memory
      CUBEJS_DB_QUERY_LIMIT: "1000000"
      CUBEJS_TELEMETRY: "false"
      CUBEJS_LOG_LEVEL: warn
    volumes:
      - ./cube/model:/cube/conf/model:ro
    depends_on:
      postgres:
        condition: service_healthy
